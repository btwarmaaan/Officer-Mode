ent(145deg,var(--panel),#0c1c30);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.card h3{font-size:14px;margin:0 0 10px;color:var(--gold2);letter-spacing:.3px}.metric{font-size:28px;font-weight:800;letter-spacing:-1px}.muted{color:var(--muted)}.small{font-size:12px}.gold{color:var(--gold)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:9px}.progress{height:8px;background:#253b55;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#b88a37,#f4d58d);border-radius:99px;width:0}.btn{border:1px solid var(--line);background:#1a3553;color:var(--text);border-radius:10px;padding:9px 12px}.btn.primary{background:var(--gold);color:#172235;border-color:var(--gold);font-weight:800}.btn.danger{border-color:#8e4545;color:#ffb0b0}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.field{display:grid;gap:4px;margin:8px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#08182b;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;min-width:0}textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.task{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b1c30}.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--gold);margin-top:2px}.task.done{opacity:.65}.task.done .taskname{text-decoration:line-through}.taskmain{flex:1;min-width:0}.taskname{font-weight:650}.taskmeta{font-size:11px;color:var(--muted)}.taskdetails{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.taskdetails input{padding:7px;font-size:12px}.pill{font-size:10px;border:1px solid var(--line);padding:3px 7px;border-radius:99px;color:var(--gold2)}.list{display:grid;gap:8px}.empty{color:var(--muted);font-size:13px;padding:12px;text-align:center}.ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--p,0%),#263d58 0);position:relative;flex:none}.ring:before{content:"";position:absolute;inset:7px;background:#10233b;border-radius:50%}.ring b{position:relative;font-size:17px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold2)}.subjectbar{display:grid;grid-template-columns:90px 1fr 42px;gap:8px;align-items:center;font-size:12px}.subjectbar .progress{height:7px}.note{border-left:3px solid var(--gold);padding:8px 10px;background:#e7bd6310;color:var(--muted);font-size:12px;border-radius:0 8px 8px 0}.footer{text-align:center;color:#7388a2;font-size:11px;padding:25px 0}.hidden{display:none!important}
@media(max-width:720px){.span3,.span4{grid-column:span 6}.span6,.span8{grid-column:span 12}.app{padding:10px 10px 80px}.hero{padding:17px}.top{align-items:flex-start}.clock strong{font-size:15px}.nav{margin:0 -10px;padding:8px 10px}.formgrid{grid-template-columns:1fr 1fr}}

<body><div class="app">
<header class="top"><div class="brand"><div class="crest">✦</div><div><div class="eyebrow">OFFICER MODE 2.0</div><h1>ARMAN KHAN</h1><p>NDA 1 — 2027 · PERSONAL COMMAND CENTRE</p></div></div><div class="clock"><span id="today"></span><strong id="clock">--:--:--</strong><span id="liveStatus">DISCIPLINE IS A DAILY CHOICE</span></div></header>
<nav class="nav" id="nav"></nav><main id="pages"></main><div class="footer">OFFICER MODE 2.0 · Your data stays on this device unless you export it. Back up regularly.</div>
</div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STORE="officerModeArman_v2", OLD=["officerModeArman_v1","officerMode","ndaStudyData"];
const schedule=[
["06:00","06:15","Wake up, freshen up and make bed","Routine"],["06:15","07:00","Physical fitness, stretching and exercise","Fitness"],
["07:00","07:30","Bath and breakfast","Routine"],["07:30","08:00","Newspaper, English reading and current affairs","GAT"],
["08:00","09:00","NDA Mathematics online class","NDA Maths"],["09:00","10:00","NDA Mathematics question practice","NDA Maths"],
["10:00","10:15","Short break","Break"],["10:15","11:15","B.Sc. Physics online class","Physics"],
["11:15","11:45","Physics numerical practice","Physics"],["11:45","12:45","B.Sc. Chemistry online class","Chemistry"],
["12:45","13:15","Chemistry notes and practice","Chemistry"],["13:15","14:00","Lunch and rest","Break"],
["14:00","15:00","B.Sc. Mathematics online class","B.Sc. Maths"],["15:00","15:30","B.Sc. Mathematics practice","B.Sc. Maths"],
["15:30","16:30","NDA English online class","English"],["16:30","17:00","Snacks and prepare for coaching","Routine"],
["17:00","19:00","Teach students at coaching","Teaching"],["19:00","19:30","Refresh, walk and relax","Break"],
["19:30","20:30","NDA GAT online class","GAT"],["20:30","21:00","Dinner","Break"],
["21:00","21:30","GAT MCQ practice and revision","GAT"],["21:30","21:45","SSB speaking practice and daily review","SSB"],
["21:45","22:00","Prepare for bed","Routine"]
];
const tabs=["Dashboard","Timetable","Daily Checklist","NDA Maths","NDA GAT","English","B.Sc. PCM","SSB Practice","Fitness","Revision","Mock Tests","Alarms","Progress","Personal Notes"];
const subjects=["NDA Maths","GAT","English","Physics","Chemistry","B.Sc. Maths","SSB","Fitness"];
const gatDays=["Physics","History","Geography","Chemistry","Biology & General Science","Indian Polity & Current Affairs","GAT Mock Test & Analysis"];
const alarmDefaults=[["06:00","Wake Up"],["06:15","Fitness"],["08:00","NDA Maths"],["10:15","Physics"],["11:45","Chemistry"],["14:00","B.Sc. Mathematics"],["15:30","NDA English"],["19:30","NDA GAT"],["21:00","GAT Revision"],["21:30","SSB Practice"],["21:45","Sleep Routine"]];
const defaults=()=>({tasks:{},alarms:alarmDefaults.map((a,i)=>({id:i,time:a[0],label:a[1],enabled:false,sound:"beep"})),masterAlarm:false,revisions:[],tests:[],notes:"",vocab:[],speaking:[],fitness:{},math:{chapter:"",formula:"",mistakes:"",questions:0,correct:0},gat:{},english:{grammar:0,speaking:0},pcm:{},settings:{theme:"dark"}});
let data=load(),active="Dashboard",alarmTimers={},audioCtx=null;
function load(){try{let d=JSON.parse(localStorage.getItem(STORE));if(d&&typeof d==="object")return {...defaults(),...d};for(const k of OLD){let old=localStorage.getItem(k);if(old){let p=JSON.parse(old);return {...defaults(),...p};}}}catch(e){console.warn("Saved data could not be parsed",e)}return defaults()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));$("#saveState")?.replaceChildren(document.createTextNode("Saved on this device"));}catch(e){alert("Could not save: device storage may be full. Export a backup and free space.")}}
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function mins(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function dur(a,b){return mins(b)-mins(a)}
function taskKey(i){return dateKey()+":"+i}
function getTask(i){return data.tasks[taskKey(i)]||{done:false,spent:"",notes:""}}
function doneCount(){return schedule.filter((_,i)=>getTask(i).done).length}
function pct(){return Math.round(doneCount()/schedule.length*100)}
function studyMinutes(){return schedule.reduce((s,x,i)=>s+(getTask(i).done?dur(x[0],x[1]):0),0)}
function fmt(n){return `${Math.floor(n/60)}h ${n%60}m`}
function nav(){ $("#nav").innerHTML=tabs.map(t=>`<button data-tab="${esc(t)}" class="${active===t?"active":""}">${esc(t)}</button>`).join("");$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.tab));}
function page(t,body){return `<section class="page ${active===t?"active":""}" id="p-${t.replace(/\W/g,"")}">${body}</section>`}
function card(title,content,span="span6"){return `<div class="card ${span}"><h3>${title}</h3>${content}</div>`}
function progressBar(v,max=100){let p=Math.max(0,Math.min(100,max?100*v/max:0));return `<div class="progress"><i style="width:${p}%"></i></div>`}
function ring(v){return `<div class="ring" style="--p:${v}%"><b>${v}%</b></div>`}
function taskList(indices,editable=true){return `<div class="list">${indices.map(i=>{let x=schedule[i],s=getTask(i);return `<div class="task ${s.done?"done":""}"><input aria-label="Complete ${esc(x[2])}" type="checkbox" data-check="${i}" ${s.done?"checked":""}><div class="taskmain"><div class="row"><span class="taskname">${esc(x[2])}</span><span class="pill">${esc(x[3])}</span></div><div class="taskmeta">${x[0]}–${x[1]} · ${dur(x[0],x[1])} min scheduled · ${s.done?"Completed":"Pending"}</div>${editable?`<div class="taskdetails"><input type="number" min="0" max="600" placeholder="Actual minutes" aria-label="Actual minutes" data-spent="${i}" value="${esc(s.spent)}"><input placeholder="Optional note" aria-label="Task note" data-note="${i}" value="${esc(s.notes)}"></div>`:""}</div></div>`}).join("")}</div>`}
function nextTask(){let now=new Date(),m=now.getHours()*60+now.getMinutes();return schedule.find(x=>mins(x[0])>m)||null}
function dashboard(){let next=nextTask(),studied=studyMinutes(),today=dateKey();let gatDone=[3,18,20].filter(i=>getTask(i).done).reduce((s,i)=>s+dur(schedule[i][0],schedule[i][1]),0);return `<div class="hero"><div class="eyebrow">MISSION: NDA 1 · 2027</div><h2>OFFICER MODE</h2><p>ARMAN KHAN · B.Sc. PCM · Self-study command centre</p><div class="actions"><span class="pill">WAKE 06:00</span><span class="pill">SLEEP 22:00</span><span class="pill">10+ HOUR CAPACITY</span></div></div><div class="grid">
${card("TODAY'S MISSION",`<div class="row">${ring(pct())}<div><div class="metric">${doneCount()} / ${schedule.length}</div><div class="muted small">activities completed</div><div style="margin-top:9px">${progressBar(pct())}</div></div></div>`,"span4")}
${card("STUDY TIME",`<div class="metric">${fmt(studied)}</div><div class="muted small">Scheduled time counted only for completed tasks</div>`,"span4")}
${card("GAT DAILY REQUIREMENT",`<div class="metric">${gatDone} / 120 <small>min</small></div><div class="muted small">Target: exactly 2 hours daily</div>${progressBar(gatDone,120)}`,"span4")}
${card("NEXT SCHEDULED TASK",next?`<div class="metric">${next[0]}</div><strong>${esc(next[2])}</strong><div class="muted small">Until ${next[1]} · ${next[3]}</div>`:`<div class="metric">22:00</div><strong>Day complete</strong><div class="muted small">Protect your recovery time.</div>`,"span6")}
${card("TODAY'S FOCUS",`<div class="note">Small disciplined actions compound. Complete the next task, record actual time, and review honestly at night.</div><div class="actions"><button class="btn primary" data-go="Daily Checklist">Open daily checklist</button><button class="btn" data-go="Timetable">View timetable</button></div>`,"span6")}
${card("SUBJECT CONTROL",subjects.map(s=>{let ids=schedule.map((x,i)=>x[3]===s?i:-1).filter(i=>i>=0),d=ids.filter(i=>getTask(i).done).length;return `<div class="subjectbar"><span>${s}</span>${progressBar(d,Math.max(1,ids.length))}<b>${d}/${ids.length}</b></div>`}).join("<div style='height:9px'></div>"),"span12")}
${card("QUICK ACTIONS",`<div class="actions"><button class="btn" data-go="NDA Maths">Maths tracker</button><button class="btn" data-go="NDA GAT">GAT tracker</button><button class="btn" data-go="Revision">Add revision</button><button class="btn" data-go="Mock Tests">Log mock test</button><button class="btn" data-go="Alarms">Alarm settings</button></div>`,"span12")}
</div>`}
function timetable(){return `<div class="hero"><div class="eyebrow">DAILY OPERATING PLAN</div><h2>Timetable</h2><p>23 planned blocks · 06:00–22:00</p></div><div class="grid">${card("DAILY SCHEDULE",taskList(schedule.map((_,i)=>i)),"span12")}</div>`}
function checklist(){return `<div class="hero"><div class="eyebrow">EXECUTION LOG</div><h2>Daily Checklist</h2><p>Tick tasks yourself. Add actual time and notes to keep your record honest.</p></div><div class="grid">${card("COMPLETION",`<div class="row">${ring(pct())}<div><div class="metric">${doneCount()} / ${schedule.length}</div><div class="muted">Daily completion</div><div class="muted small">${fmt(studyMinutes())} scheduled study blocks completed</div></div></div>`,"span4")}${card("MISSED / PENDING",`<div class="metric">${schedule.length-doneCount()}</div><div class="muted small">Tasks not marked complete</div>`,"span4")}${card("WEEKLY CONSISTENCY",`<div class="metric">${weekConsistency()} / 7</div><div class="muted small">Days with at least one completed activity (this week)</div>`,"span4")}${card("ALL ACTIVITIES",taskList(schedule.map((_,i)=>i)),"span12")}</div>`}
function weekConsistency(){let n=0,now=new Date();for(let j=0;j<7;j++){let d=new Date(now);d.setDate(d.getDate()-j);let k=dateKey(d)+":";if(Object.keys(data.tasks).some(x=>x.startsWith(k)&&data.tasks[x].done))n++}return n}
function maths(){let m=data.math;return `<div class="hero"><div class="eyebrow">NDA MATHEMATICS · 2 HOURS DAILY</div><h2>Concepts → Accuracy → Speed</h2><p>60 min lecture + 60 min practice, formula revision and mistake analysis.</p></div><div class="grid">${card("DAILY MATHS TARGET",taskList([4,5]),"span6")}${card("PRACTICE COUNTER",`<div class="formgrid"><div class="field"><label>Questions attempted</label><input id="mathQ" type="number" min="0" value="${m.questions||0}"></div><div class="field"><label>Correct answers</label><input id="mathC" type="number" min="0" value="${m.correct||0}"></div></div><div class="metric">${m.questions?Math.round(m.correct/m.questions*100):0}%</div><div class="muted small">Accuracy (correct ÷ attempted)</div><button class="btn primary" id="saveMath">Save counters</button>`,"span6")}${card("CHAPTER-WISE PROGRESS",`<div class="field"><label>Current chapter / topic</label><input id="mathChapter" value="${esc(m.chapter)}" placeholder="e.g. Trigonometry"></div><div class="field"><label>Formula notebook</label><textarea id="mathFormula" placeholder="Write key formulas...">${esc(m.formula)}</textarea></div><div class="field"><label>Mistake notebook</label><textarea id="mathMistakes" placeholder="Question, error, correct method...">${esc(m.mistakes)}</textarea></div><button class="btn primary" id="saveMathNotes">Save Maths notes</button>`,"span6")}${card("WEEKLY MATHS TEST",`<p class="muted small">Log your weekly Maths test in Mock Tests and tag weak topics for targeted revision.</p><button class="btn" data-go="Mock Tests">Open Mock Tests</button>`,"span6")}</div>`}
function gat(){let day=(new Date().getDay()+6)%7,focus=gatDays[day];return `<div class="hero"><div class="eyebrow">GENERAL ABILITY TEST · EXACTLY 120 MINUTES</div><h2>GAT Mission</h2><p>30 min current affairs + 60 min subject class + 30 min MCQs/revision.</p></div><div class="grid">${card("TODAY'S SUBJECT",`<div class="metric">${esc(focus)}</div><div class="muted small">Weekly rotation · ${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][day]}</div>`,"span4")}${card("DAILY GAT BLOCKS",taskList([3,18,20]),"span8")}${card("SUBJECT-WISE TRACKER",`${gatDays.map((s,i)=>`<div class="field"><label>${s}</label><div class="row"><input data-gat="${i}" type="number" min="0" placeholder="Minutes studied" value="${esc(data.gat[i]||"")}"><span class="pill">${i===6?"Mock":"Subject"}</span></div></div>`).join("")}<button class="btn primary" id="saveGat">Save GAT subject minutes</button>`,"span12")}</div>`}
function english(){return `<div class="hero"><div class="eyebrow">NDA ENGLISH · DAILY 1-HOUR CLASS</div><h2>Language & Communication</h2><p>Grammar, vocabulary, comprehension and confident spoken English.</p></div><div class="grid">${card("DAILY ENGLISH CLASS",taskList([14]),"span6")}${card("TOPIC CHECKLIST",["Grammar","Vocabulary","Synonyms & Antonyms","Spotting Errors","Sentence Improvement","Ordering of Words","Comprehension","Idioms & Phrases","Fill in the Blanks"].map(x=>`<label class="task"><input type="checkbox" data-topic="eng-${esc(x)}" ${data.english["eng-"+x]?"checked":""}><span>${x}</span></label>`).join(""),"span6")}${card("10 NEW WORDS",`<p class="muted small">Add one word and meaning per entry. Review weekly.</p><div class="formgrid"><input id="word" placeholder="New vocabulary word"><input id="meaning" placeholder="Meaning / example"></div><button class="btn primary" id="addWord">Add word</button><div class="list" style="margin-top:10px">${(data.vocab||[]).map((v,i)=>`<div class="task"><div class="taskmain"><b>${esc(v.word)}</b><div class="muted small">${esc(v.meaning)}</div></div><button class="btn danger" data-delword="${i}">Delete</button></div>`).join("")||'<div class="empty">No vocabulary saved yet.</div>'}</div>`,"span6")}${card("GRAMMAR & SPEAKING COUNTERS",`<div class="formgrid"><div class="field"><label>Grammar questions practised</label><input id="grammarCount" type="number" min="0" value="${data.english.grammar||0}"></div><div class="field"><label>Speaking minutes logged</label><input id="speakingCount" type="number" min="0" value="${data.english.speaking||0}"></div></div><button class="btn primary" id="saveEnglish">Save English progress</button><p class="muted small">Weekly vocabulary revision: review all saved words every Sunday.</p>`,"span6")}</div>`}
function pcm(){return `<div class="hero"><div class="eyebrow">B.SC. PCM · PARALLEL ACADEMIC TRACK</div><h2>Physics · Chemistry · Mathematics</h2><p>Each subject: 60-minute online class + 30-minute practice.</p></div><div class="grid">${[["Physics",[7,8],"Numericals, formulas and important derivations"],["Chemistry",[9,10],"Reactions, formulas, notes and concept revision"],["B.Sc. Mathematics",[12,13],"Theorems, formulas and problem solving"]].map(([s,ids,desc])=>card(s,`<p class="muted small">${desc}</p>${taskList(ids)}<div class="field"><label>Chapter / current focus</label><input data-pcm="${s}" value="${esc(data.pcm[s]||"")}" placeholder="Enter current chapter"></div>`,"span4")).join("")}<div class="span12"><button class="btn primary" id="savePCM">Save PCM chapter focus</button><div class="note" style="margin-top:10px">Weekly chapter tests: log each Physics, Chemistry and Mathematics test in Mock Tests.</div></div></div>`}
function ssb(){let topics=["Describe a recent national or international event and its impact.","Give a 2-minute self-introduction without memorising.","Should discipline be taught through sports? Explain both sides.","Describe a challenge you solved and what you learned.","Explain one scientific idea in simple English.","What makes a good team leader?"];let idx=(new Date().getDate()-1)%topics.length;return `<div class="hero"><div class="eyebrow">PERSONALITY DEVELOPMENT · 15 MIN DAILY</div><h2>Speak with clarity. Think with balance.</h2><p>Self-introduction · Lecturette · Group discussion · Current affairs</p></div><div class="grid">${card("TODAY'S SPEAKING TOPIC",`<div class="metric" style="font-size:18px">${topics[idx]}</div><div class="muted small">Speak for 2 minutes, then review clarity, structure and confidence.</div>`,"span6")}${card("DAILY SESSION",taskList([21]),"span6")}${card("WRITE YOUR RESPONSE",`<textarea id="ssbResponse" placeholder="Write your key points or speaking reflection...">${esc(data.speaking[dateKey()]||"")}</textarea><button class="btn primary" id="saveSpeaking">Save today's response</button>`,"span8")}${card("PRACTICE IDEAS",`<ul class="muted small"><li>Self-introduction: background, interests, goals.</li><li>Lecturette: opening, 2–3 points, balanced conclusion.</li><li>Group discussion: listen, build on ideas, stay respectful.</li><li>Current affairs: explain facts, context and impact.</li></ul>`,"span4")}</div>`}
function fitness(){let f=data.fitness[dateKey()]||{};return `<div class="hero"><div class="eyebrow">PHYSICAL READINESS · 45 MINUTES</div><h2>Build consistency safely</h2><p>Warm-up → mobility → basic strength → cardio → stretching → recovery.</p></div><div class="grid">${card("MORNING FITNESS BLOCK",taskList([1]),"span6")}${card("WORKOUT CHECKLIST",["Warm-up (5–7 min)","Mobility (5 min)","Basic strength (15 min)","Easy cardio (10 min)","Stretching (5 min)","Recovery / hydration (3–5 min)"].map((x,i)=>`<label class="task"><input type="checkbox" data-fit="${i}" ${f[i]?"checked":""}><span>${x}</span></label>`).join("")+`<div class="field"><label>Workout notes / recovery</label><textarea id="fitNotes">${esc(f.notes||"")}</textarea></div><button class="btn primary" id="saveFit">Save fitness log</button>`,"span6")}${card("WEEKLY CONSISTENCY",`<div class="metric">${Object.keys(data.fitness).filter(k=>Object.values(data.fitness[k]).some(Boolean)).length} days logged</div><p class="muted small">Choose age-appropriate effort, increase gradually, hydrate and take rest when needed. Stop if you feel pain, dizziness or unwell.</p>`,"span12")}</div>`}
function revision(){return `<div class="hero"><div class="eyebrow">SPACED REVISION SYSTEM</div><h2>Remember what you learn</h2><p>Plan same-day, next-day, weekly and monthly revision.</p></div><div class="grid">${card("ADD REVISION",`<div class="formgrid"><div class="field"><label>Subject</label><select id="revSubject">${subjects.map(s=>`<option>${s}</option>`).join("")}<option>Physics</option><option>Chemistry</option><option>B.Sc. Maths</option></select></div><div class="field"><label>Revision type</label><select id="revType"><option>Same-day</option><option>Next-day</option><option>Weekly</option><option>Monthly</option></select></div></div><div class="field"><label>Chapter / topic</label><input id="revTopic" placeholder="Chapter or topic"></div><div class="field"><label>Revision date</label><input id="revDate" type="date" value="${dateKey()}"></div><button class="btn primary" id="addRevision">Add to revision plan</button>`,"span4")}${card("REVISION QUEUE",`<div class="list">${data.revisions.map((r,i)=>`<div class="task ${r.done?"done":""}"><input type="checkbox" data-rev="${i}" ${r.done?"checked":""}><div class="taskmain"><b>${esc(r.topic)}</b><div class="taskmeta">${esc(r.subject)} · ${esc(r.type)} · ${esc(r.date)}</div></div><button class="btn danger" data-delrev="${i}">×</button></div>`).join("")||'<div class="empty">No revisions scheduled. Add your first topic.</div>'}</div>`,"span8")}</div>`}
function mocks(){return `<div class="hero"><div class="eyebrow">MEASURE · ANALYSE · IMPROVE</div><h2>Mock Test Performance</h2><p>Record attempts, accuracy, marks, time and weak areas.</p></div><div class="grid">${card("LOG A TEST",`<div class="formgrid"><div class="field"><label>Test date</label><input id="testDate" type="date" value="${dateKey()}"></div><div class="field"><label>Subject</label><select id="testSubject">${["NDA Maths","GAT","English","Physics","Chemistry","B.Sc. Maths","Full NDA"].map(s=>`<option>${s}</option>`).join("")}</select></div><div class="field"><label>Total questions</label><input id="totalQ" type="number" min="0"></div><div class="field"><label>Correct</label><input id="correctQ" type="number" min="0"></div><div class="field"><label>Incorrect</label><input id="wrongQ" type="number" min="0"></div><div class="field"><label>Unattempted</label><input id="skipQ" type="number" min="0"></div><div class="field"><label>Marks</label><input id="marks" type="number" step="0.25"></div><div class="field"><label>Time taken (minutes)</label><input id="testTime" type="number" min="0"></div></div><div class="field"><label>Weak topics</label><input id="weak" placeholder="e.g. Trigonometry, Modern History"></div><div class="field"><label>Improvement notes</label><textarea id="improve"></textarea></div><button class="btn primary" id="addTest">Save test result</button>`,"span6")}${card("PERFORMANCE OVERVIEW",`<div class="metric">${data.tests.length}</div><div class="muted small">Tests recorded</div><div class="metric" id="avgAccuracy">${avgAccuracy()}%</div><div class="muted small">Average accuracy (recorded correct ÷ attempted)</div>`,"span6")}${card("TEST HISTORY",`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Subject</th><th>Correct / Total</th><th>Accuracy</th><th>Marks</th><th></th></tr></thead><tbody>${data.tests.map((t,i)=>`<tr><td>${esc(t.date)}</td><td>${esc(t.subject)}</td><td>${t.correct}/${t.total}</td><td>${t.accuracy}%</td><td>${esc(t.marks)}</td><td><button class="btn danger" data-deltest="${i}">Delete</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No test records yet.</td></tr>'}</tbody></table></div>`,"span12")}${card("WEEKLY / MONTHLY VIEW",chartTests(),"span12")}</div>`}
function avgAccuracy(){return data.tests.length?Math.round(data.tests.reduce((s,t)=>s+t.accuracy,0)/data.tests.length):0}
function chartTests(){let recent=data.tests.slice(-8);return recent.length?`<div class="list">${recent.map(t=>`<div class="subjectbar"><span>${esc(t.date.slice(5))} ${esc(t.subject)}</span>${progressBar(t.accuracy)}<b>${t.accuracy}%</b></div>`).join("")}</div><p class="muted small">Recent test accuracy. Export data for longer-term analysis.</p>`:'<div class="empty">Charts appear after you record mock tests.</div>'}
function alarms(){return `<div class="hero"><div class="eyebrow">PERSONAL REMINDERS</div><h2>Alarm Control</h2><p>Alarms are OFF by default. Enable individually and then enable the master switch.</p></div><div class="grid">${card("MASTER CONTROL",`<label class="task"><input type="checkbox" id="masterAlarm" ${data.masterAlarm?"checked":""}><span><b>Master alarms ${data.masterAlarm?"ON":"OFF"}</b><div class="taskmeta">Master OFF pauses every alarm without deleting its settings.</div></span></label><div class="note">Android/browser limitation: web alarms are reliable only while this app or its active browser context is running. Background timers may be suspended, and a PWA cannot guarantee exact-time alarms when Android kills it. Use your phone's Clock app for mission-critical wake-up alarms.</div>`,"span12")}${card("INDIVIDUAL ALARMS",data.alarms.map((a,i)=>`<div class="task"><input type="checkbox" data-alarm="${i}" ${a.enabled?"checked":""}><div class="taskmain"><div class="formgrid"><input type="time" data-alarmtime="${i}" value="${esc(a.time)}"><input data-alarmlabel="${i}" value="${esc(a.label)}" aria-label="Alarm label"></div><div class="row"><span class="taskmeta">${a.enabled&&data.masterAlarm?"Armed when app is active":"Not actively armed"}</span><select data-alarmsound="${i}" style="max-width:115px"><option value="beep" ${a.sound==="beep"?"selected":""}>Beep</option><option value="silent" ${a.sound==="silent"?"selected":""}>Silent</option></select></div></div></div>`).join("")+`<button class="btn primary" id="saveAlarms">Save alarm settings</button><button class="btn" id="testAlarm">Test sound</button><button class="btn" id="enableNotifications">Enable browser notifications</button>`,"span12")}</div>`}
function progress(){return `<div class="hero"><div class="eyebrow">PROGRESS INTELLIGENCE</div><h2>Consistency over intensity</h2><p>Your progress is calculated from tasks you explicitly mark complete.</p></div><div class="grid">${card("TODAY",`<div class="metric">${pct()}%</div>${progressBar(pct())}<p class="muted small">${doneCount()} of ${schedule.length} tasks · ${fmt(studyMinutes())} completed scheduled blocks</p>`,"span4")}${card("THIS WEEK",`<div class="metric">${weekConsistency()} / 7</div><p class="muted small">Days with at least one task checked</p>`,"span4")}${card("MOCK TESTS",`<div class="metric">${avgAccuracy()}%</div><p class="muted small">Average recorded accuracy · ${data.tests.length} tests</p>`,"span4")}${card("SUBJECT COMPLETION",subjects.map(s=>{let ids=schedule.map((x,i)=>x[3]===s?i:-1).filter(i=>i>=0),d=ids.filter(i=>getTask(i).done).length;return `<div class="subjectbar"><span>${s}</span>${progressBar(d,ids.length||1)}<b>${ids.length?Math.round(d/ids.length*100):0}%</b></div>`}).join("<div style='height:12px'></div>"),"span12")}${card("DATA & BACKUP",`<p class="muted small">Export a JSON backup before changing browser, clearing site data or reinstalling the app.</p><div class="actions"><button class="btn primary" id="export">Export backup</button><label class="btn">Import backup<input type="file" id="import" accept="application/json" hidden></label><button class="btn danger" id="reset">Reset all app data</button></div><p id="saveState" class="muted small">Saved locally on this device.</p>`,"span12")}</div>`}
function notes(){return `<div class="hero"><div class="eyebrow">PERSONAL KNOWLEDGE BASE</div><h2>Personal Notes</h2><p>Keep planning notes, goals, reflections and reminders in one place.</p></div><div class="grid">${card("MY NOTES",`<textarea id="personalNotes" style="min-height:300px" placeholder="Write your notes, weekly goals, lessons learned...">${esc(data.notes)}</textarea><button class="btn primary" id="saveNotes">Save notes</button>`,"span12")}</div>`}
function render(){let content={
"Dashboard":dashboard(),"Timetable":timetable(),"Daily Checklist":checklist(),"NDA Maths":maths(),"NDA GAT":gat(),"English":english(),"B.Sc. PCM":pcm(),"SSB Practice":ssb(),"Fitness":fitness(),"Revision":revision(),"Mock Tests":mocks(),"Alarms":alarms(),"Progress":progress(),"Personal Notes":notes()
};$("#pages").innerHTML=tabs.map(t=>page(t,content[t])).join("");nav();bind();$("#today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function show(t){active=t;render();window.scrollTo({top:0,behavior:"smooth"})}
function bind(){
document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{let i=+el.dataset.check,k=taskKey(i),s=getTask(i);data.tasks[k]={...s,done:el.checked};save();render()});
document.querySelectorAll("[data-spent]").forEach(el=>el.onchange=()=>{let i=+el.dataset.spent,k=taskKey(i);data.tasks[k]={...getTask(i),spent:el.value};save()});
document.querySelectorAll("[data-note]").forEach(el=>el.onchange=()=>{let i=+el.dataset.note,k=taskKey(i);data.tasks[k]={...getTask(i),notes:el.value};save()});
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#saveMath")?.addEventListener("click",()=>{let q=+$("#mathQ").value,c=+$("#mathC").value;if(c>q){alert("Correct answers cannot exceed attempted questions.");return}data.math.questions=q;data.math.correct=c;save();render()});
$("#saveMathNotes")?.addEventListener("click",()=>{Object.assign(data.math,{chapter:$("#mathChapter").value,formula:$("#mathFormula").value,mistakes:$("#mathMistakes").value});save();alert("Maths notes saved.")});
$("#saveGat")?.addEventListener("click",()=>{document.querySelectorAll("[data-gat]").forEach(e=>data.gat[e.dataset.gat]=Math.max(0,+e.value||0));save();alert("GAT subject minutes saved.")});
document.querySelectorAll("[data-topic]").forEach(e=>e.onchange=()=>{data.english[e.dataset.topic]=e.checked;save()});
$("#addWord")?.addEventListener("click",()=>{let word=$("#word").value.trim(),meaning=$("#meaning").value.trim();if(!word){alert("Enter a vocabulary word.");return}data.vocab.push({word,meaning});save();render()});
document.querySelectorAll("[data-delword]").forEach(e=>e.onclick=()=>{data.vocab.splice(+e.dataset.delword,1);save();render()});
$("#saveEnglish")?.addEventListener("click",()=>{data.english.grammar=+$("#grammarCount").value||0;data.english.speaking=+$("#speakingCount").value||0;save();alert("English progress saved.")});
$("#savePCM")?.addEventListener("click",()=>{document.querySelectorAll("[data-pcm]").forEach(e=>data.pcm[e.dataset.pcm]=e.value);save();alert("PCM focus saved.")});
$("#saveSpeaking")?.addEventListener("click",()=>{data.speaking[dateKey()]=$("#ssbResponse").value;save();alert("Speaking response saved.")});
document.querySelectorAll("[data-fit]").forEach(e=>e.onchange=()=>{let f=data.fitness[dateKey()]||{};f[e.dataset.fit]=e.checked;data.fitness[dateKey()]=f;save()});
$("#saveFit")?.addEventListener("click",()=>{let f=data.fitness[dateKey()]||{};f.notes=$("#fitNotes").value;data.fitness[dateKey()]=f;save();alert("Fitness log saved.")});
$("#addRevision")?.addEventListener("click",()=>{let topic=$("#revTopic").value.trim();if(!topic){alert("Enter a chapter or topic.");return}data.revisions.push({subject:$("#revSubject").value,type:$("#revType").value,topic,date:$("#revDate").value,done:false});save();render()});
document.querySelectorAll("[data-rev]").forEach(e=>e.onchange=()=>{data.revisions[+e.dataset.rev].done=e.checked;save();render()});
document.querySelectorAll("[data-delrev]").forEach(e=>e.onclick=()=>{data.revisions.splice(+e.dataset.delrev,1);save();render()});
$("#addTest")?.addEventListener("click",()=>{let total=+$("#totalQ").value,c=+$("#correctQ").value,w=+$("#wrongQ").value,u=+$("#skipQ").value;if(!total||c+w+u!==total||c<0||w<0||u<0){alert("Enter a positive total and ensure correct + incorrect + unattempted equals total questions.");return}data.tests.push({date:$("#testDate").value,subject:$("#testSubject").value,total,correct:c,wrong:w,unattempted:u,marks:$("#marks").value,time:$("#testTime").value,weak:$("#weak").value,improve:$("#improve").value,accuracy:Math.round(c/(c+w)*100)||0});save();render()});
document.querySelectorAll("[data-deltest]").forEach(e=>e.onclick=()=>{data.tests.splice(+e.dataset.deltest,1);save();render()});
$("#masterAlarm")?.addEventListener("change",()=>{data.masterAlarm=$("#masterAlarm").checked;save();armAlarms();render()});
document.querySelectorAll("[data-alarm],[data-alarmtime],[data-alarmlabel],[data-alarmsound]").forEach(e=>e.addEventListener("change",()=>{let i=+(e.dataset.alarm??e.dataset.alarmtime??e.dataset.alarmlabel??e.dataset.alarmsound);let a=data.alarms[i];if(e.dataset.alarm!==undefined)a.enabled=e.checked;if(e.dataset.alarmtime!==undefined)a.time=e.value;if(e.dataset.alarmlabel!==undefined)a.label=e.value;if(e.dataset.alarmsound!==undefined)a.sound=e.value;save();armAlarms()}));
$("#saveAlarms")?.addEventListener("click",()=>{save();armAlarms();alert("Alarm settings saved. Keep the app open for in-app alerts.")});
$("#testAlarm")?.addEventListener("click",()=>beep());
$("#enableNotifications")?.addEventListener("click",async()=>{if(!("Notification" in window)){alert("Notifications are not supported by this browser.");return}let p=await Notification.requestPermission();alert("Notification permission: "+p)});
$("#saveNotes")?.addEventListener("click",()=>{data.notes=$("#personalNotes").value;save();alert("Notes saved.")});
$("#export")?.addEventListener("click",exportBackup);
$("#import")?.addEventListener("change",importBackup);
$("#reset")?.addEventListener("click",()=>{if(confirm("This permanently clears all Officer Mode data in this browser. Export a backup first. Continue?")){localStorage.removeItem(STORE);data=defaults();save();render();armAlarms()}});
}
function exportBackup(){let blob=new Blob([JSON.stringify({app:"OFFICER MODE 2.0",version:2,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"}),a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download="arman-officer-mode-backup-"+dateKey()+".json";a.click();URL.revokeObjectURL(u)}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d||typeof d!=="object"||!d.tasks)throw Error("Not a valid Officer Mode backup");if(!confirm("Import backup? Current app data will be replaced. Export current data first if needed."))return;data={...defaults(),...d};save();render();armAlarms();alert("Backup restored.")}catch(err){alert("Import failed: "+err.message)}e.target.value=""};r.readAsText(f)}
function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);o.start();o.stop(audioCtx.currentTime+.6)}catch(e){alert("Sound unavailable in this browser.")}}
function armAlarms(){Object.values(alarmTimers).forEach(clearTimeout);alarmTimers={};if(!data.masterAlarm)return;let now=new Date();data.alarms.forEach((a,i)=>{if(!a.enabled)return;let [h,m]=a.time.split(":").map(Number),when=new Date();when.setHours(h,m,0,0);if(when<=now)when.setDate(when.getDate()+1);let ms=when-now;alarmTimers[i]=setTimeout(()=>{if(a.sound!=="silent")beep();if("Notification"in window&&Notification.permission==="granted")new Notification("OFFICER MODE — "+a.label,{body:"Scheduled reminder · "+a.time,icon:"icon-192.png"});else alert("OFFICER MODE REMINDER\\n"+a.label+" · "+a.time);armAlarms()},ms)})}
setInterval(()=>{let n=new Date();$("#clock").textContent=n.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});},1000);
if("serviceWorker"in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW registration failed",e)));
if("Notification"in window&&Notification.permission==="default"){/* Ask only after explicit user action; browser permission is not prompted on load. */}
nav();render();armAlarms();
})();
</script></body></html>
